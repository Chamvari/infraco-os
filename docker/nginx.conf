# ─────────────────────────────────────────────────────────────
# infraco-os  –  Nginx  (HTTPS termination, SPA, API reverse proxy)
#
# Loaded as /etc/nginx/conf.d/default.conf, i.e. INSIDE the stock http{} block,
# so the zone/upstream directives below are valid here.
#
# Routing mirrors web/vite.config.ts (the dev proxy) plus the notification
# webhooks. The NestJS API uses an EMPTY global prefix and its controllers own
# their full paths (e.g. @Controller('api/finance'), @Controller('auth')), so
# every proxied location passes the URI through UNCHANGED — proxy_pass has no
# trailing slash / URI, which preserves the original request path.
# ─────────────────────────────────────────────────────────────

# ── Rate-limit zones (per client IP) ──────────────────────────
limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

# ── API upstream — load-balances across api replicas ──────────
# docker compose --scale api=N → Docker DNS resolves 'api' to every replica.
upstream infraco_api {
    least_conn;
    server api:3001;
    keepalive 32;
}

# Shared proxy settings reused by every API location.
# (proxy_pass is set per-location, without a URI, to preserve the request path.)
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    server_name _;
    # Plain-HTTP liveness path for the web container healthcheck (no TLS, no redirect).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    # Everything else is redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── TLS ──────────────────────────────────────────────────
    ssl_certificate      /etc/nginx/ssl/infraco.crt;
    ssl_certificate_key  /etc/nginx/ssl/infraco.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    # ── Security headers ─────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    limit_conn conn_limit 20;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Nginx health check (edge only) ───────────────────────
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Auth — stricter rate limit (the login route is /auth/login) ──
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://infraco_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Notification webhooks (POST /notifications/ussd, /sms/dlr) ──
    # Public, unauthenticated carrier callbacks. NOTE: SMSPop is SMS-only and does
    # not call these — retained for a future USSD/DLR-capable provider.
    location /notifications/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        proxy_pass         http://infraco_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── API surfaces (mirror web/vite.config.ts: /api, /plots, /leases) ──
    location ~ ^/(api|plots|leases)(/|$) {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        proxy_pass         http://infraco_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── Static assets (Vite hashed filenames) ─────────────────
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # ── SPA fallback (client-side routing, e.g. /leasing) ─────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block sensitive paths ─────────────────────────────────
    location ~ /\.            { deny all; }
    location ~* \.(env|sql|bak|log)$ { deny all; }
}
