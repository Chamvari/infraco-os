# ─────────────────────────────────────────────────────────────
# infraco-os  –  PostgreSQL production tuning
# Target: Hetzner CX32  (4 vCPU / 8 GB RAM)
# Adjust shared_buffers and work_mem proportionally for larger VMs
# ─────────────────────────────────────────────────────────────

# ── Connections ──────────────────────────────────────────────
# Listen on all interfaces — PgBouncer and the API connect over the private
# Docker network, not localhost. Without this Postgres defaults to 'localhost'
# and every cross-container connection is refused. 5432 is never published to
# the host (see docker-compose.prod.yml — no ports on db).
listen_addresses = '*'

# PgBouncer sits in front — Postgres only needs pool_size + headroom
max_connections = 100

# ── Memory ───────────────────────────────────────────────────
shared_buffers       = 2GB          # 25% of RAM
effective_cache_size = 6GB          # 75% of RAM (hint to planner)
work_mem             = 16MB         # per sort/hash operation
maintenance_work_mem = 256MB        # for VACUUM, CREATE INDEX

# ── WAL / durability ─────────────────────────────────────────
wal_buffers          = 64MB
checkpoint_completion_target = 0.9
max_wal_size         = 2GB
min_wal_size         = 512MB

# ── Query planner ────────────────────────────────────────────
random_page_cost     = 1.1          # SSD — lower than spinning disk default (4.0)
effective_io_concurrency = 200      # SSD concurrent I/O

# ── Parallel queries ─────────────────────────────────────────
max_parallel_workers_per_gather = 2
max_parallel_workers            = 4
max_worker_processes            = 8

# ── Logging (production) ─────────────────────────────────────
log_min_duration_statement = 1000   # log queries taking > 1 second
log_checkpoints            = on
log_connections            = off
log_disconnections         = off
log_lock_waits             = on
deadlock_timeout           = 1s

# ── Autovacuum ───────────────────────────────────────────────
autovacuum                        = on
autovacuum_vacuum_scale_factor    = 0.05   # more aggressive than default 0.2
autovacuum_analyze_scale_factor   = 0.02

# ── Locale / timezone ────────────────────────────────────────
timezone = 'Africa/Harare'
